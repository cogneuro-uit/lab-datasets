name: Deploy labcat to Azure production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p-resapp-labdata-production

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Run tests
        run: uv run --locked pytest

      - name: Build deployment ZIP
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          uv export --locked --no-dev --no-emit-project \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uv pip install --python-version 3.12 --only-binary :all: \
            --require-hashes --target "$RUNNER_TEMP/package" \
            -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --python-version 3.12 --no-deps \
            --target "$RUNNER_TEMP/package" "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP/package"
          uv run --no-project --python 3.12 python -c "from labcat.web import app_factory"
          zip -qr "$RUNNER_TEMP/labcat.zip" .

      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: labcat
          path: ${{ runner.temp }}/labcat.zip
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write

    steps:
      - name: Download deployment ZIP
        uses: actions/download-artifact@v4
        with:
          name: labcat

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.P_RESAPP_DEPLOYMENT_ID_CLIENTID }}
          tenant-id: ${{ secrets.P_RESAPP_DEPLOYMENT_ID_TENANTID }}
          subscription-id: ${{ secrets.P_RESAPP_DEPLOYMENT_ID_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: p-resapp-labdata
          package: labcat.zip